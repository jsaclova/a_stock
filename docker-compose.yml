# CasaOS 배포용 compose — 프런트(nginx) 1개 + Deno 함수 7개
# 사용법: docker compose up -d --build → http://<서버IP>:8090
services:
  web:
    build:
      context: .
    ports:
      - "8090:80"
    depends_on:
      - stock-data
      - market-news
      - market-quotes
      - top-stocks
      - fx-krw
      - ticker
      - portfolio
    restart: unless-stopped

  stock-data:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/stock-data/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  market-news:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/market-news/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  market-quotes:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/market-quotes/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  top-stocks:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/top-stocks/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  fx-krw:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/fx-krw/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  ticker:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/ticker/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped

  portfolio:
    image: denoland/deno:2.1.4
    command: run --allow-net /functions/portfolio/index.ts
    volumes:
      - ./supabase/functions:/functions:ro
    restart: unless-stopped
