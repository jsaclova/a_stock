# 정적 파일 + /functions/v1/* → Deno 함수 컨테이너로 프록시
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Edge Functions (같은 origin → CORS 문제 없음)
  location /functions/v1/stock-data {
    rewrite ^/functions/v1/stock-data/?(.*)$ /$1 break;
    proxy_pass http://stock-data:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/market-news {
    rewrite ^/functions/v1/market-news/?(.*)$ /$1 break;
    proxy_pass http://market-news:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/market-quotes {
    rewrite ^/functions/v1/market-quotes/?(.*)$ /$1 break;
    proxy_pass http://market-quotes:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/top-stocks {
    rewrite ^/functions/v1/top-stocks/?(.*)$ /$1 break;
    proxy_pass http://top-stocks:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/fx-krw {
    rewrite ^/functions/v1/fx-krw/?(.*)$ /$1 break;
    proxy_pass http://fx-krw:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/ticker {
    rewrite ^/functions/v1/ticker/?(.*)$ /$1 break;
    proxy_pass http://ticker:8000;
    proxy_set_header Host $host;
  }
  location /functions/v1/portfolio {
    rewrite ^/functions/v1/portfolio/?(.*)$ /$1 break;
    proxy_pass http://portfolio:8000;
    proxy_set_header Host $host;
  }

  # Supabase Auth (GoTrue) + PostgREST + DB (같은 origin 프록시用)
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html은 항상 재검증 (구 번들 캐시 방지)
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # 해시 포함 정적 자산은 장기 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
